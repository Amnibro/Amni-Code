<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><title>editor test</title>
<style>
.editor-col{width:0;overflow:hidden;display:flex;flex-direction:column}
.editor-col.open{width:600px}
.editor-body{height:300px}
.cmd-overlay,.qo-overlay{display:none}.cmd-overlay.open,.qo-overlay.open{display:block}
.cmd-palette,.qo-palette{display:none}.cmd-palette.open,.qo-palette.open{display:block}
body{background:#111;color:#ddd;font-family:sans-serif}
</style></head>
<body data-theme="dark">
<div id="toast-container"></div>
<button id="editor-toggle">Editor</button>
<textarea id="input"></textarea><button id="send">send</button>
<div id="sidebar-tree"><div class="sb-path">/work</div><div class="sb-item sb-file" data-act="editor.open" data-arg="/work/a.py">a.py</div><div class="sb-item sb-file" data-act="editor.open" data-arg="/work/b.js">b.js</div><div class="sb-item sb-file" data-act="editor.open" data-arg="/work/missing.txt">missing</div></div>
<div class="editor-col" id="editor-col">
<div class="editor-header"><h3 id="editor-filename">untitled.py</h3><div>
<button data-act="editor.suggest">S</button><button data-act="editor.save">V</button><button data-act="editor.toggle">X</button></div></div>
<div class="tab-bar" id="tab-bar"></div>
<div class="breadcrumbs" id="breadcrumbs"></div>
<div class="editor-body" id="editor-body"><div id="monaco-container" style="width:100%;height:100%;"></div></div>
</div>
<div class="status-right"><span id="sb-lang">Plaintext</span><span id="sb-pos">Ln 1, Col 1</span></div>
<div class="qo-overlay" id="qo-overlay"></div>
<div class="qo-palette" id="qo-palette"><input id="qo-input" autocomplete="off"><div class="qo-list" id="qo-list"></div></div>
<div class="cmd-overlay" id="cmd-overlay"></div>
<div class="cmd-palette" id="cmd-palette"><input id="cmd-input" autocomplete="off"><div class="cmd-list" id="cmd-list"></div></div>
<div id="posted"></div>
<script>window.__sendClicks=0;document.getElementById('send').addEventListener('click',()=>window.__sendClicks++);</script>
<script src="/vendor/monaco/vs/loader.js"></script>
<script type="module">
import { start } from '/helium.js';
window.__app = start({ wasm: '/ui.wasm' });
</script>
</body></html>
