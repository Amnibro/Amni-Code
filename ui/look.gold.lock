health_done():
	buf byte[>..] ~= []
	web::fetch_take(web::ev_id(), buf)
	web::fetch_free(web::ev_id())
	d json::Doc ~= default<json::Doc>()
	root, err := json::parse(buf, d)
	if root < 0: return
	if json::kind(d, root) != json::K_OBJ: return
	v := json::member(d, root, "version")
	if v < 0: return
	s, ok := json::as_string(d, v)
	if !ok || s.len == 0: return
	e i32 := web::el("sb-ver")
	if e != 0:
		out byte[>..] ~= []
		out.append("Amni-Code v")
		out.append(s)
		web::text(e, out);
