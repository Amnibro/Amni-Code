url_part(out byte[>..]&, text const byte[:]):
	hex := "0123456789ABCDEF"
	for c text:
		keep := (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') || (c >= '0' && c <= '9') || c == '-' || c == '_' || c == '.' || c == '!' || c == '~' || c == '*' || c == '\'' || c == '(' || c == ')'
		if keep:
			out.push(c)
		else:
			out.push('%')
			out.push(hex[(c >> 4) as int])
			out.push(hex[(c & 15) as int]);
