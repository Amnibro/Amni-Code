event(tag i32, kind i32):
	if tag == SETTINGS_BTN:
		open_panel()
	else if tag == OVERLAY:
		close_panels()
	else if tag == MODEL_CHANGE:
		p byte[>..] ~= []
		value_of(p, "cfg-provider")
		if p == "amni":
			save_config(F_SAVE_CHECK)
		else:
			save_config(F_SAVE)
	else if tag == PROVIDER_CHANGE:
		p byte[>..] ~= []
		value_of(p, "cfg-provider")
		e ~= core::provider(p)
		if e < 0: e = core::provider("amni")
		u := member_text(core::tables, e, "url")
		if u.len > 0: set_value("cfg-url", u)
		apply_provider_chrome(p)
		web::html(web::el("cfg-model"), "<option>Loading...</option>")
		save_config(F_SAVE_MODELS)
	else if tag == URL_CHANGE || tag == MODEL_DIR_CHANGE:
		save_config(F_SAVE_MODELS)
	else if tag == DIR_CHANGE:
		save_config(F_SAVE)
		d byte[>..] ~= []
		value_of(d, "cfg-dir")
		load_dirs(d)
		load_sidebar(d)
	else if tag == HF_KEY:
		key byte[>..] ~= []
		web::ev_key(key)
		if key == "Enter":
			web::ev_prevent()
			hf_search()
	else if tag == S_LOG:
		if kind == web::EV_CHUNK:
			on_log_chunk()
		else if kind == web::EV_FETCH:
			on_log_end()
	else if kind == web::EV_FETCH:
		if tag == F_CONFIG:
			on_config()
		else if tag == F_SEATS:
			on_seats()
		else if tag == F_MODELS:
			on_models()
		else if tag == F_DIRS:
			on_dirs()
		else if tag == F_LS:
			on_ls()
		else if tag == F_SAVE:
			b byte[>..] ~= []
			reply(b)
		else if tag == F_SAVE_MODELS:
			b byte[>..] ~= []
			reply(b)
			load_models("")
		else if tag == F_SAVE_CHECK:
			b byte[>..] ~= []
			reply(b)
			check_and_start()
		else if tag == F_SRV_START:
			on_server_start()
		else if tag == F_SRV_STATUS:
			on_server_status()
		else if tag == F_HF_SEARCH:
			on_hf_search()
		else if tag == F_HF_FILES:
			on_hf_files()
		else if tag == F_HF_DL:
			on_hf_dl()
		else if tag == F_HF_PROG:
			on_hf_prog()
	else if kind == web::EV_TIMER:
		if tag == T_CLOSE:
			close_server_panel(true)
		else if tag == T_HF_POLL:
			on_hf_poll()
		else if tag == T_HF_REFRESH:
			load_models("")
