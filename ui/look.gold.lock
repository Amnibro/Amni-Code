cycle_amni_theme():
	pool byte[>..] ~= []
	ends int[>..] ~= []
	pool.append("braid")
	ends.push(pool.len)
	pool.append("amniscient")
	ends.push(pool.len)
	themes := json::member(core::tables, core::tables_root, "amni_themes")
	if themes >= 0:
		json::each(core::tables, themes) { nm := json::name_of(core::tables, it); if !(nm == "braid") && !(nm == "amniscient") { pool.append(nm); ends.push(pool.len) } }
	cur byte[>..] ~= []
	if !web::store_get("amniTheme", cur) || cur.len == 0:
		cur.clear()
		if !web::store_get("amni_skin", cur) || cur.len == 0:
			cur.clear()
			cur.append("braid")
	idx ~= 0
	for k ends.len:
		s := if k == 0 { 0 } else { ends[k - 1] }
		if pool[s..ends[k]] == cur: idx = k
	nxt := (idx + 1) % ends.len
	s2 := if nxt == 0 { 0 } else { ends[nxt - 1] }
	chosen byte[>..] ~= []
	chosen.append(pool[s2..ends[nxt]])
	apply_amni_theme(chosen)
	msg byte[>..] ~= []
	msg.append("Theme: ")
	t := core::theme(chosen)
	done ~= false
	if t >= 0:
		lb := json::member(core::tables, t, "label")
		if lb >= 0:
			ls, ok := json::as_string(core::tables, lb)
			if ok:
				msg.append(ls)
				done = true
	if !done: msg.append(chosen)
	core::toast(msg);
