[package]
name = "amni-code"
version = "3.0.1"
edition = "2021"

[[bin]]
name = "amni"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "ws"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4"] }
open = "5"
futures = "0.3"
tokio-stream = "0.1"
dirs = "7"
urlencoding = "2"
url = "2"
regex = "1"
tao = "0.32"
wry = "0.47"

[profile.dev]
debug = 0
incremental = false

