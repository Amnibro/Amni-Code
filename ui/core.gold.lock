sse_take(buf byte[>..]&, event byte[>..]&, data byte[>..]&) bool:
	event.clear()
	data.clear()
	stop ~= -1
	i ~= 0
	while i + 1 < buf.len:
		if buf[i] == '\n' && buf[i + 1] == '\n':
			stop = i
			break
		i += 1
	if stop < 0: return false
	has_data ~= false
	ls ~= 0
	j ~= 0
	while j <= stop:
		if j == stop || buf[j] == '\n':
			line := buf[ls..j]
			if starts_with(line, "event:"):
				event.clear()
				event.append(trim(line[6..]))
			else if starts_with(line, "data:"):
				skip := if line.len > 5 && line[5] == ' ' { 6 } else { 5 }
				if has_data: data.push('\n')
				data.append(line[skip..])
				has_data = true
			ls = j + 1
		j += 1
	remain byte[>..] ~= []
	remain.append(buf[stop + 2..])
	buf.clear()
	buf.append(remain)
